[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "robot2013-mcp"
version = "1.0.0"
description = "MCP server for Autodesk Robot Structural Analysis 2013 via COM"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pywin32>=306",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
